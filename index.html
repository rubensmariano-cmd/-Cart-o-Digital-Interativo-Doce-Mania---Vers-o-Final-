<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doce Mania - Cartão Digital Interativo</title>
    <style>
        :root {
            --primary-color: #d63384;
            --secondary-color: #ff85a2;
            --bg-color: #fff0f3;
            --text-color: #4a4a4a;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card-container {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(214, 51, 132, 0.15);
            overflow: hidden;
            text-align: center;
            padding: 30px 20px;
        }
        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
            font-size: 26px;
        }
        .subtitle {
            font-size: 14px;
            color: #777;
            margin-bottom: 25px;
        }
        .jingle-box {
            background: #fff5f7;
            border: 2px dashed var(--secondary-color);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 25px;
        }
        .jingle-box h4 {
            margin: 0 0 5px 0;
            color: var(--primary-color);
        }
        .jingle-box p {
            font-size: 13px;
            margin: 0 0 10px 0;
        }
        audio {
            width: 100%;
            outline: none;
        }
        .gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .gallery-item {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            background: #f9f9f9;
        }
        .gallery-item img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            display: block;
        }
        .gallery-item p {
            font-size: 12px;
            margin: 8px 0;
            font-weight: bold;
            color: var(--primary-color);
        }
        .btn-whatsapp {
            display: inline-block;
            background-color: #25d366;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
            transition: background 0.3s;
        }
        .btn-whatsapp:hover {
            background-color: #1ebe57;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <h1>Doce Mania</h1>
        <p class="subtitle">Confeitaria Artesanal & Delícias Exclusivas</p>

        <!-- Player do Jingle -->
        <div class="jingle-box">
            <h4>Nosso Jingle Oficial 🎵</h4>
            <p>Clique no play para entrar no clima!</p>
            <audio controls preload="metadata">
                <source src="jingle.mp3" type="audio/mpeg">
                Seu navegador não suporta áudio.
            </audio>
        </div>

        <!-- Galeria de Delícias -->
        <div class="gallery">
            <div class="gallery-item">
                <img src="bento_cake.jpg" alt="Bento Cake">
                <p>Bento Cake</p>
            </div>
            <div class="gallery-item">
                <img src="bolo_pote.jpg" alt="Bolo no Pote">
                <p>Bolo no Pote</p>
            </div>
            <div class="gallery-item">
                <img src="brigadeiro.jpg" alt="Brigadeiros Gourmet">
                <p>Brigadeiros Gourmet</p>
            </div>
            <div class="gallery-item">
                <img src="cookie.jpg" alt="Cookies Crocantes">
                <p>Cookies</p>
            </div>
        </div>

        <!-- Botão de Contato -->
        <a href="https://wa.me/5542999999999?text=Olá!%20Vim%20pelo%20cartão%20digital%20e%20quero%20fazer%20um%20pedido." class="btn-whatsapp" target="_blank">
            Fazer Pedido no WhatsApp
        </a>
    </div>

</body>
</html>
